<!DOCTYPE html>
<html>
<head>
<title>GitHub Profile Finder</title>

<style>
    body{
        font-family: Arial;
        text-align: center;
        background-color: hsla(0, 1%, 37%, 0.257);
        padding: 40px;
    }
    input,button{
        padding: 12px;
        font-size: 20px;
        margin: 5px;
    }
    button{
        background-color: black;
        color:beige;
        border: 0;
        cursor: pointer;
    }
    #result{
        margin-top:30px;
    }
    .profile{
        background:white;
        width:320px;
        margin:auto;
        padding:25px;
        border-radius: 15px;
        box-shadow: 0 5px 15px #ccc;
    }
    .profile img{
        width: 120px;
        height: 120px;
        border-radius: 50%;
    }
    a{
        display: inline-block;
        margin-top: 15px;
        padding: 10px;
        background: black;
        color: white;
        text-decoration: none;
        border-radius: 5px;
    }



</style>

</head>

<body>

    <h1> 💻GitHub Profile Finder </h1>

    <input id="username" type="text" placeholder="Enter Github Name">
    <button onclick="searchUser()">Search</button>

    <div id="result"></div>


    <script>

       async function searchUser(){
            const user = document.getElementById("username").value.trim();
            const result = document.getElementById("result");

            if(!user){
                result.innerHTML = "<h3>Enter a Username❗</h3>";
                return;
            }

            result.innerHTML = "<h3>🔍Searching....</h3>";

            try{
                const response = await fetch(`https://api.github.com/users/${user}`);

                
            if(response.status === 404){
             result.innerHTML = "<h3>User not Found❌</h3>";
             return;   
            }

            const data = await response.json();

            result.innerHTML = `<div class ="profile">
                <img src ="${data.avatar_url}">
                <h2>${data.name || data.login}</h2>
                <p>👤@${data.login}</p>
                <p>📦Repositories:${data.public_repos}</p>
                <p>👥Followers:${data.followers}</p>
                <p>➡️Following:${data.following}</p>
                <a href="${data.html_url}" target="_blank"> View GitHub Profile</a>
                </div>`;
            }
            
            catch(error){
                result.innerHTML = "<h3> Something went wrong❌</h3>";
            }

        }

    </script>


</body>
</html>
